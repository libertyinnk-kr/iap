<body>
<style>
/* Layout: one phone-width column, doodle sticker look. Counters, a field that zooms out through four scales, a bar, three skills, one big button. Single light look on purpose. */
:root{--bg:#fff;--ink:#111;--y:#ffe24d;--b:#2f6bff;--r:#ff4d4d;--g:#8a8a8a;--soft:#eee;
  --hand:'Gaegu','Apple SD Gothic Neo','Malgun Gothic',sans-serif;--plain:'Malgun Gothic','Apple SD Gothic Neo',system-ui,sans-serif}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--hand);font-size:20px;line-height:1.3;word-break:keep-all;-webkit-user-select:none;user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;color:inherit;cursor:pointer}
input{-webkit-user-select:text;user-select:text}
:focus-visible{outline:3px solid var(--b);outline-offset:2px}
#app{max-width:420px;margin:0 auto;padding-block:14px 20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-height:100%;display:flex;flex-direction:column;gap:10px;position:relative}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.hl{background:var(--y);padding:0 8px;border-radius:6px;transform:rotate(-1.5deg);display:inline-block}
.pill{border:2.5px solid var(--ink);border-radius:99px;padding:0 12px;font-weight:700;background:var(--bg)}
.nums{align-items:flex-end}
.nums b{font-size:36px;line-height:1;white-space:nowrap}
.lab{font-size:18px;line-height:1.1}
.rt{text-align:right}
.blue{color:var(--b)}
.small{font-size:16px;color:var(--g)}
.scene{position:relative;border:2.5px solid var(--ink);border-radius:18px 24px 16px 26px;overflow:hidden;background:var(--bg)}
#field{display:block;width:100%}
#field.zoom{animation:zoom .7s ease-out}
@keyframes zoom{from{transform:scale(1.6);opacity:.2}to{transform:scale(1);opacity:1}}
.stage{position:absolute;top:6px;right:12px;font-size:16px;color:var(--g)}
.stage .on{color:var(--ink);background:var(--y);padding:0 5px;border-radius:5px}
.t .f{fill:var(--bg);stroke:var(--ink);stroke-width:2;stroke-linejoin:round;transition:fill .25s}
.t.s1 .f{fill:var(--y)}
.t.s2 .f{fill:var(--b)}
.t .e{stroke:var(--ink);stroke-width:1.8;stroke-linecap:round;fill:none;opacity:0}
.t.s1 .e,.t.s2 .e{opacity:1}
.t.s2 .e{stroke:var(--bg)}
.t .m{stroke:var(--bg);stroke-width:1.8;stroke-linecap:round;fill:none;opacity:0}
.t.s2 .m{opacity:1}
.t.hit .f{fill:var(--bg);stroke:var(--r)}
.t.hit .e,.t.hit .m{opacity:0}
.outline{fill:none;stroke:var(--ink);stroke-width:2;stroke-linejoin:round;stroke-dasharray:1 5;stroke-linecap:round}
#guy{position:absolute;left:2px;bottom:0;width:150px;transition:transform .2s}
#guy svg{display:block;width:100%}
#guy text{font-family:var(--hand);fill:var(--ink)}
#guy .fw{display:none}
#guy.worry{transform:translateY(16px)}
#guy.worry .fn{display:none}
#guy.worry .fw{display:block}
#guy.bounce{animation:bounce .12s}
@keyframes bounce{50%{transform:translateY(-5px)}}
.banner{position:absolute;top:34px;left:50%;transform:translateX(-50%) rotate(-2deg);border:2.5px solid var(--ink);border-radius:12px 16px 10px 18px;padding:0 14px;font-size:26px;font-weight:700;background:var(--bg);white-space:nowrap;display:none}
.banner.bad{display:block;background:var(--r);color:var(--bg)}
.banner.ok{display:block}
.float{position:absolute;font-weight:700;font-size:22px;pointer-events:none;animation:up .7s ease-out forwards;text-shadow:-1.5px 0 var(--bg),1.5px 0 var(--bg),0 -1.5px var(--bg),0 1.5px var(--bg)}
.float.neg{color:var(--r);font-size:28px}
@keyframes up{to{transform:translateY(-34px);opacity:0}}
.xp{height:14px;border:2.5px solid var(--ink);border-radius:99px;overflow:hidden;background:var(--bg)}
#xpFill{height:100%;width:0;background:var(--y);border-right:2.5px solid var(--ink);transition:width .15s}
.chip{flex:1;border:2.5px solid var(--ink);border-radius:12px 9px 13px 8px;padding:2px 2px;text-align:center;font-size:17px;background:var(--bg)}
.chip b{display:block;font-size:19px;line-height:1.05}
#tap{background:var(--y);border:2.5px solid var(--ink);border-radius:16px 20px 14px 22px;padding:10px 0;font-size:30px;font-weight:700;transform:rotate(-1deg);width:100%}
#tap:active{transform:rotate(-1deg) scale(.97)}
#tap.frozen{background:var(--soft);color:var(--g);border-color:var(--g)}
.over{position:absolute;inset:0;background:rgba(255,255,255,.95);display:none;flex-direction:column;justify-content:center;gap:14px;padding:22px 16px;text-align:center;z-index:5}
.over.show{display:flex}
.over.top{justify-content:flex-start;overflow-y:auto;gap:12px}
.over.lock button,.over.lock input{pointer-events:none;opacity:.45}
.over h1{font-size:34px;line-height:1.15;margin:0;font-weight:700}
.big{font-size:54px;line-height:1;font-weight:700}
.btn{background:var(--y);border:2.5px solid var(--ink);border-radius:16px 20px 14px 22px;padding:8px 0;font-size:26px;font-weight:700;width:100%}
.btn.ghost{background:var(--bg)}
.btn.mini{width:auto;padding:2px 14px;font-size:20px;flex:none}
.btn[disabled]{opacity:.4;cursor:default}
.opt{display:flex;align-items:center;gap:12px;text-align:left;border:2.5px solid var(--ink);border-radius:14px 18px 12px 20px;padding:8px 12px;background:var(--bg);width:100%;font-size:22px}
#oPick{justify-content:flex-start;padding-top:40px;gap:10px}
.opt .nm{min-width:0;flex:1}
.opt .eff{display:block;font-size:17px;line-height:1.15}
.opt .rt2{text-align:right;white-space:nowrap;flex:none}
.tag.ty{background:var(--y);padding:0 6px;border-radius:6px}
.tag.tr{color:var(--r)}
.banner.st{display:block;background:var(--y);font-size:21px;white-space:normal;width:84%;text-align:center;line-height:1.2;padding:4px 12px}
.nums{position:relative}
.tapwrap{position:relative}
.coach{display:none;position:absolute;z-index:4;background:var(--bg);border:2.5px solid var(--ink);border-radius:12px 16px 10px 18px;padding:5px 10px;font-size:19px;line-height:1.2;pointer-events:none;text-align:center;text-wrap:balance}
.coach::before{content:attr(data-n);display:block;font-family:var(--plain);font-size:11px;color:var(--g);line-height:1.3}
#veil{display:none;position:absolute;inset:0;background:rgba(255,255,255,.72);z-index:3}
#app.c1 #veil,#app.c2 #veil,#app.c3 #veil{display:block}
#app.c1 #cGoal,#app.c2 #cCol,#app.c3 #cTap{display:block}
#app.c1 .nums,#app.c2 .scene,#app.c3 .tapwrap{z-index:4}
.coach::after{content:"";position:absolute;width:12px;height:12px;background:var(--bg);border:2.5px solid var(--ink);border-left:0;border-top:0}
.coach.up::after{top:-9px;right:30px;transform:rotate(-135deg)}
.coach.down::after{bottom:-9px;left:50%;margin-left:-6px;transform:rotate(45deg)}
.coach.plain::after{display:none}
.coach .cl{display:flex;align-items:center;gap:6px;text-align:left;white-space:nowrap}
.coach .cl svg{width:26px;height:26px;flex:none}
.opt:active{background:var(--y)}
.opt[disabled]{opacity:.35}
.opt svg{width:38px;height:38px;flex:none}
.opt .tag{margin-left:auto;font-weight:700;white-space:nowrap}
.opt .lv{display:block;font-size:17px;color:var(--g)}
.tbd{border:2px dashed var(--g);border-radius:10px;padding:8px;font-family:Consolas,monospace;font-size:13px;color:var(--g);line-height:1.4}
.copybox{display:flex;flex-direction:column;gap:6px;align-items:center}
.copy{margin:0;font-size:23px;line-height:1.25;text-wrap:balance}
.ph{font-family:var(--plain);font-size:11px;color:var(--g)}
.legend{display:flex;justify-content:center;align-items:center;gap:10px;font-size:22px}
.legend svg{width:34px;height:34px}
.board{border:2.5px solid var(--ink);border-radius:14px 18px 12px 20px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--bg)}
.board b{font-size:24px}
#lbIni{font-family:var(--hand);font-size:24px;font-weight:700;border:2.5px solid var(--ink);border-radius:10px;padding:0 10px;text-transform:uppercase;letter-spacing:.12em;background:var(--bg);color:var(--ink);min-width:0;flex:1}
.lbrow{display:grid;grid-template-columns:2em 1fr auto;gap:8px;font-size:21px;line-height:1.35;font-variant-numeric:tabular-nums;padding:0 4px;text-align:left}
.lbrow.me{background:var(--y);border-radius:6px}
.lbrow span:first-child{color:var(--g)}
.note{font-family:var(--plain);font-size:13px;color:var(--g);margin:0;line-height:1.4}
.note.bad{color:var(--r)}
.sharerow .btn{flex:1;min-width:0}
.sharerow.two .btn{font-size:19px;white-space:nowrap;padding:9px 2px}
.shbox{font-family:var(--plain);font-size:13px;width:100%;border:2px solid var(--g);border-radius:8px;padding:6px 8px;background:var(--bg);color:var(--ink)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
#bCta{display:none}
</style>

<script src="https://t1.kakaocdn.net/kakao_js_sdk/2.8.5/kakao.min.js" integrity="sha384-v6JKY3z4FUkWq21oZDHZe74YvuPk/WUrVLrDHTBojHXClOSa3iXy7sCXPY1jkFbj" crossorigin="anonymous"></script>
<script>
// MODEL-START
var CFG={N:25000000,T:180,S0:5,
  tapBase:2,tapK:0.015,autoK:0.095,sdK:0.2,
  friction:[1,0.5,0.32,0.22],
  conBase:0.002,conK:0.004,
  raidFirst:20,raidMin:14,raidMax:24,
  catchBase:0.85,catchK:0.15,catchFloor:0.1,
  lossBase:0.7,lossK:0.12,lossFloor:0.1,freeze:5,
  maxLv:5,
  xp:[30,90,250,700,2000,6000,17000,50000,150000,400000,1200000,3500000,10000000],
  stages:[1000,100000,3000000,25000000]};
function newState(){return {t:0,R:CFG.S0,C:0,peak:CFG.S0,sd:1,sec:0,con:1,picks:0,pending:0,frozen:0,nextRaid:CFG.raidFirst,raids:0,caught:0,over:false}}
function S(st){return st.R+st.C}
function canPick(st){return st.sd<CFG.maxLv||st.sec<CFG.maxLv||st.con<CFG.maxLv}
function bump(st){
  var s=S(st); if(s>st.peak)st.peak=s;
  while(st.picks+st.pending<CFG.xp.length&&st.peak>=CFG.xp[st.picks+st.pending]&&canPick(st))st.pending++;
}
function stageOf(st){var i=0;while(i<3&&st.peak>=CFG.stages[i])i++;return i}
function boost(st){return (1+CFG.sdK*st.sd)*CFG.friction[stageOf(st)]}
function tap(st){
  if(st.over||st.frozen>0||st.pending>0)return 0;
  var s=S(st);
  var add=Math.max(CFG.tapBase,s*CFG.tapK*boost(st))*(1-s/CFG.N);
  add=Math.max(0,Math.min(add,CFG.N-s));
  st.R+=add; bump(st); return add;
}
function step(st,dt,rnd){
  var ev=[]; if(st.over||st.pending>0)return ev;
  st.t+=dt;
  if(st.frozen>0){st.frozen=Math.max(0,st.frozen-dt)}

  if(st.t>=st.nextRaid&&st.t<CFG.T){
    st.raids++; st.nextRaid=st.t+CFG.raidMin+rnd()*(CFG.raidMax-CFG.raidMin);
    var p=Math.max(CFG.catchFloor,CFG.catchBase-CFG.catchK*st.sec);

    }else ev.push({type:'safe'});
  }
  bump(st);
  if(st.t>=CFG.T){st.t=CFG.T;st.over=true;ev.push({type:'over'})}

}

/* share: a link plus one line. The phone's own share menu where the page is allowed to open it, otherwise copy to the clipboard, otherwise a box to copy from by hand. */
var SHARE_URL='https://iap.libertyinnorthkorea.or.kr/test-r4n8wq/';
var SHARE_TAGS='utm_source=game_share&utm_medium=referral';
function shareLink(){
  if(!SHARE_URL)return '';
  if(SHARE_URL.indexOf('claude.ai')!==-1||!SHARE_TAGS)return SHARE_URL;
  return SHARE_URL+(SHARE_URL.indexOf('?')===-1?'?':'&')+SHARE_TAGS;
}
function doShare(){
  if(!lastScore)return;
  var text=COPY.share.replace('{score}',fmt(lastScore.score)),url=shareLink(),full=text+(url?' '+url:'');
  function box(){var b=$('shBox');b.hidden=false;b.value=full;b.focus();b.select();$('shNote').textContent=''}
  function copy(){
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(full).then(function(){$('shNote').textContent=COPY.copied},box);
    }else box();
  }
  var data={title:document.title,text:text};if(url)data.url=url;
  var inViewer=!!(window.claude&&typeof window.claude.use==='function'),can=false;
  try{can=!inViewer&&typeof navigator.share==='function'&&(!navigator.canShare||navigator.canShare(data))}catch(e){can=false}
  if(can){navigator.share(data).then(function(){},function(err){if(err&&err.name==='AbortError')return;copy()})}
  else copy();
}

/* leaderboard: the artifact's shared store when the page runs on claude.ai (one row per person, their best), this device only otherwise */
var LB={db:null,uid:null,mode:'local',rows:[],local:[],posted:false,myId:null,loading:false,timer:0};
function lbNote(tx,bad){var e=$('lbNote');e.textContent=tx||'';e.className='note'+(bad?' bad':'')}

function lbInit(){

  Promise.all([window.claude.use('db'),window.claude.use('user')]).then(function(r){

    try{
      db.collection('scores').orderBy('score','desc').limit(20).onSnapshot(function(snap){
        clearTimeout(LB.timer);LB.mode='shared';LB.loading=false;
        LB.rows=snap.docs.map(function(d){var x=d.data()||{};return {id:d.id,ini:String(x.ini||'').slice(0,3),score:+x.score||0}});

function lbSubmit(e){
  e.preventDefault();if(LB.posted||!lastScore)return;

  if(ini.length<2||ini.length>3){lbNote('Letters or digits only, 2 or 3 of them.',true);return}
  var row={ini:ini,score:lastScore.score,reached:lastScore.reached,caught:lastScore.caught,v:'idle-0.2',at:new Date().toISOString()};
  LB.posted=true;$('lbSave').disabled=true;$('lbIni').disabled=true;
  var lid='l'+Date.now();LB.local.push({id:lid,ini:row.ini,score:row.score});lbSaveLocal();

    LB.myId=lid;lbNote(LB.db?'Saved on this device. This account cannot post to the shared board.':'Saved on this device only.');lbRender();return;
  }
  var ref=LB.db.doc('scores/'+LB.uid);
  ref.get().then(function(snap){
    var old=snap.exists?(+((snap.data()||{}).score)||0):-1;
    if(old>=row.score){lbNote('Your best on the board is still '+fmt(old)+'.');lbRender();return null}
    return ref.set(row).then(function(){lbNote('Saved to the shared board.');lbRender()});

  });
}
