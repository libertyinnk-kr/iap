<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!--
  Test page for https://iap.libertyinnorthkorea.or.kr/test-r4n8wq/ (upload index.html and card.png together).
  1. Search for KAKAO_KEY and paste the JavaScript key there. Without a key the Kakao button stays hidden and the plain share button still works.
  2. The Kakao script tag near the end pins SDK 2.8.5 with the integrity value from Kakao's tutorial page. If the button never appears, copy the tag from the SDK download page in Kakao Developers.
  3. The preview tags below (og:) are a starting point; change the title, add a description, swap the image.
  4. Scores are kept in each visitor's own browser. There is no shared board on this page.
-->
<title>북한이 변했음 좋겠음</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap">
<meta property="og:type" content="website">
<meta property="og:title" content="북한이 변했음 좋겠음">
<meta property="og:url" content="https://iap.libertyinnorthkorea.or.kr/test-r4n8wq/">
<meta property="og:image" content="https://iap.libertyinnorthkorea.or.kr/test-r4n8wq/card.png">
<style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<style>
/* Version 2. Layout: one phone-width column, doodle sticker look: two counters, a field that zooms out through four scales, a gauge, a quiet status strip, one big button. A step-by-step tutorial sits over the field. Single light look on purpose. */
:root{--bg:#fff;--ink:#111;--y:#ffe24d;--b:#2f6bff;--r:#ff4d4d;--g:#8a8a8a;--soft:#eee;
  --hand:'Gaegu','Apple SD Gothic Neo','Malgun Gothic',sans-serif;--plain:'Malgun Gothic','Apple SD Gothic Neo',system-ui,sans-serif}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--hand);font-size:20px;line-height:1.3;word-break:keep-all;-webkit-user-select:none;user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;color:inherit;cursor:pointer}
input{-webkit-user-select:text;user-select:text}
:focus-visible{outline:3px solid var(--b);outline-offset:2px}
#app{max-width:420px;margin:0 auto;padding-block:12px 18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-height:100%;display:flex;flex-direction:column;gap:9px;position:relative}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.hl{background:var(--y);padding:0 8px;border-radius:6px;transform:rotate(-1.5deg);display:inline-block}
.pill{border:2.5px solid var(--ink);border-radius:99px;padding:0 12px;font-weight:700;background:var(--bg)}
.iconbtn{width:34px;height:34px;border:2.5px solid var(--ink);border-radius:50%;background:var(--bg);font-size:20px;font-weight:700;line-height:1;padding:0;flex:none}
.nums{align-items:flex-end;position:relative}
.nums b{font-size:36px;line-height:1;white-space:nowrap}
.lab{font-size:18px;line-height:1.1;white-space:nowrap}
.dot{display:inline-block;width:14px;height:14px;border-radius:50%;border:2px solid var(--ink);vertical-align:-1px;margin-right:4px}
.dot.y{background:var(--y)}
.dot.b{background:var(--b)}
.rt{text-align:right}
.blue{color:var(--b)}
.small{font-size:16px;color:var(--g)}
.scene{--tint:#fff;position:relative;border:2.5px solid var(--ink);border-radius:18px 24px 16px 26px;overflow:hidden;background:var(--tint);transition:background .6s}
#field{display:block;width:100%}
#field.zoom{animation:zoom .7s ease-out}
@keyframes zoom{from{transform:scale(1.6);opacity:.2}to{transform:scale(1);opacity:1}}
.stage{position:absolute;top:6px;right:12px;font-size:16px;color:var(--g)}
.stage .on{color:var(--ink);background:var(--y);padding:0 5px;border-radius:5px}
.t .f{fill:var(--bg);stroke:var(--ink);stroke-width:2;stroke-linejoin:round;transition:fill .25s}
.t.s1 .f{fill:var(--y)}
.t.s2 .f{fill:var(--b)}
.t .e{stroke:var(--ink);stroke-width:1.8;stroke-linecap:round;fill:none;opacity:0}
.t.s1 .e,.t.s2 .e{opacity:1}
.t.s2 .e{stroke:var(--bg)}
.t .m{stroke:var(--bg);stroke-width:1.8;stroke-linecap:round;fill:none;opacity:0}
.t.s2 .m{opacity:1}
.t.hit .f{fill:var(--soft);stroke:var(--r)}
.t.hit .e,.t.hit .m{opacity:0}
.outline{fill:none;stroke:var(--ink);stroke-width:2;stroke-linejoin:round;stroke-dasharray:1 5;stroke-linecap:round}
#guy{position:absolute;left:2px;bottom:0;width:150px;transition:transform .2s}
#guy svg{display:block;width:100%}
#guy text{font-family:var(--hand);fill:var(--ink)}
#guy .fw{display:none}
#guy.worry{transform:translateY(16px)}
#guy.worry .fn{display:none}
#guy.worry .fw{display:block}
#guy.bounce{animation:bounce .12s}
@keyframes bounce{50%{transform:translateY(-5px)}}
#raid{position:absolute;top:24px;left:-100px;width:92px;display:none;pointer-events:none;z-index:2}
#raid.go{display:block;animation:sweep 1.3s linear forwards}
@keyframes sweep{from{left:-100px}to{left:100%}}
.banner{position:absolute;top:34px;left:50%;transform:translateX(-50%) rotate(-2deg);border:2.5px solid var(--ink);border-radius:12px 16px 10px 18px;padding:0 14px;font-size:26px;font-weight:700;background:var(--bg);white-space:nowrap;display:none;z-index:3}
.banner.bad{display:block;background:var(--r);color:var(--bg)}
.banner.ok{display:block}
.banner.st{display:block;background:var(--y);font-size:22px;white-space:normal;width:84%;text-align:center;line-height:1.2;padding:6px 12px}
#fx{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:3}
.float{position:absolute;font-weight:700;font-size:22px;animation:up .7s ease-out forwards;text-shadow:-1.5px 0 var(--bg),1.5px 0 var(--bg),0 -1.5px var(--bg),0 1.5px var(--bg)}
.float.neg{color:var(--r);font-size:28px}
@keyframes up{to{transform:translateY(-34px);opacity:0}}
.rp{position:absolute;width:20px;height:20px;margin:-10px;border:2.5px solid var(--ink);border-radius:50%;animation:rp .4s ease-out forwards}
@keyframes rp{to{transform:scale(3);opacity:0}}
.cf{position:absolute;top:-12px;width:8px;height:12px;border-radius:2px;animation:fall 1.25s ease-in forwards}
@keyframes fall{to{transform:translate(var(--dx),260px) rotate(var(--rot));opacity:.25}}
.xp{height:14px;border:2.5px solid var(--ink);border-radius:99px;overflow:hidden;background:var(--bg)}
#xpFill{height:100%;width:0;background:var(--y);border-right:2.5px solid var(--ink);transition:width .15s}
.strip{justify-content:space-around;font-size:16px;line-height:1}
.sti{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.sti svg{width:20px;height:20px;flex:none}
.pips{display:inline-flex;gap:3px;align-items:center}
.pip{width:9px;height:9px;border-radius:50%;border:1.8px solid var(--ink);background:var(--bg)}
.pip.on{background:var(--ink)}
.pip.new{background:var(--y)}
.tapwrap{position:relative}
#tap{background:var(--y);border:2.5px solid var(--ink);border-radius:16px 20px 14px 22px;padding:12px 0;font-size:32px;font-weight:700;transform:rotate(-1deg);width:100%;touch-action:none}
#tap:active{transform:rotate(-1deg) scale(.97)}
#tap.pulse{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 9px rgba(255,226,77,.5)}}
#tap.frozen{background:var(--soft);color:var(--g);border-color:var(--g);animation:none}
#finger{display:none;position:absolute;right:16%;bottom:-30px;width:52px;z-index:6;pointer-events:none;animation:poke .7s ease-in-out infinite}
@keyframes poke{0%,100%{transform:translateY(12px)}50%{transform:translateY(-6px)}}
#veil{display:none;position:absolute;inset:0;background:rgba(255,255,255,.74);z-index:3}
#app.tutoring #veil{display:block}
#app.tutoring .scene{z-index:4}
#app.sp-tap .tapwrap{z-index:4}
#app.sp-tap #finger{display:block}
#app.sp-num #numC{position:relative;z-index:4;background:var(--bg);box-shadow:0 0 0 6px var(--bg);border-radius:6px}
#tut{position:absolute;inset:0;background:var(--bg);z-index:6;display:flex;flex-direction:column;justify-content:center;gap:6px;padding:10px 12px}
#tut[hidden]{display:none}
.tstep{font-family:var(--plain);font-size:12px;color:var(--g);text-align:center}
.ttext{margin:0;font-size:21px;line-height:1.25;text-align:center;text-wrap:balance}
#tDemo{display:block;width:100%;max-height:74px}
.tcards{display:flex;flex-direction:column;gap:4px;font-size:17px;line-height:1.15}
.tcards[hidden]{display:none}
.tc{display:flex;align-items:center;gap:8px}
.tc svg{width:24px;height:24px;flex:none}
.tc b{white-space:nowrap}
.tfoot{min-height:30px}
.over{position:absolute;inset:0;background:rgba(255,255,255,.96);display:none;flex-direction:column;justify-content:center;gap:14px;padding:22px 16px;text-align:center;z-index:8}
.over.show{display:flex}
.over.top{justify-content:flex-start;overflow-y:auto;gap:12px}
.over.lock button,.over.lock input{pointer-events:none;opacity:.45}
.over h1{font-size:34px;line-height:1.15;margin:0;font-weight:700}
.sub{margin:0;font-size:20px;line-height:1.25;text-wrap:balance}
.big{font-size:54px;line-height:1;font-weight:700}
.btn{background:var(--y);border:2.5px solid var(--ink);border-radius:16px 20px 14px 22px;padding:8px 0;font-size:26px;font-weight:700;width:100%}
.btn.ghost{background:var(--bg)}
.btn.mini{width:auto;padding:2px 14px;font-size:20px;flex:none}
.btn[disabled]{opacity:.4;cursor:default}
#oPick{justify-content:flex-start;padding-top:34px;gap:10px}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.card{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;border:2.5px solid var(--ink);border-radius:14px 18px 12px 20px;background:var(--bg);padding:16px 4px 10px;font-size:16px;line-height:1.2;text-align:center;min-height:172px}
.card svg{width:44px;height:44px;flex:none}
.card .cn{font-size:20px;white-space:nowrap}
.card .ce{flex:1;text-wrap:balance}
.card:active{background:var(--y)}
.card[disabled]{opacity:.35}
.reco{position:absolute;top:-13px;left:50%;transform:translateX(-50%) rotate(-3deg);background:var(--y);border:2px solid var(--ink);border-radius:8px;padding:0 8px;font-size:15px;font-weight:700;white-space:nowrap}
.reco[hidden]{display:none}
.copybox{display:flex;flex-direction:column;gap:6px;align-items:center}
.copy{margin:0;font-size:23px;line-height:1.25;text-wrap:balance}
.ph{font-family:var(--plain);font-size:11px;color:var(--g)}
.legend{display:flex;justify-content:center;align-items:center;gap:10px;font-size:22px}
.legend svg{width:34px;height:34px}
#startMaps svg,#eMap svg,#tGoal svg{width:auto;height:auto}
.hl2{display:flex;align-items:center;gap:8px;text-align:left;font-size:19px;line-height:1.2}
.hl2 svg{width:28px;height:28px;flex:none}
.board{border:2.5px solid var(--ink);border-radius:14px 18px 12px 20px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--bg)}
.board b{font-size:24px}
#lbIni{font-family:var(--hand);font-size:24px;font-weight:700;border:2.5px solid var(--ink);border-radius:10px;padding:0 10px;text-transform:uppercase;letter-spacing:.12em;background:var(--bg);color:var(--ink);min-width:0;flex:1}
.lbrow{display:grid;grid-template-columns:2em 1fr auto;gap:8px;font-size:21px;line-height:1.35;font-variant-numeric:tabular-nums;padding:0 4px;text-align:left}
.lbrow.me{background:var(--y);border-radius:6px}
.lbrow span:first-child{color:var(--g)}
.note{font-family:var(--plain);font-size:13px;color:var(--g);margin:0;line-height:1.4}
.note.bad{color:var(--r)}
.sharerow .btn{flex:1;min-width:0}
.sharerow.two .btn{font-size:19px;white-space:nowrap;padding:9px 2px}
.shbox{font-family:var(--plain);font-size:13px;width:100%;border:2px solid var(--g);border-radius:8px;padding:6px 8px;background:var(--bg);color:var(--ink)}
.coach{display:none;position:absolute;z-index:5;background:var(--bg);border:2.5px solid var(--ink);border-radius:12px 16px 10px 18px;padding:5px 12px;font-size:21px;line-height:1.2;pointer-events:none;text-align:center;text-wrap:balance}
.coach::after{content:"";position:absolute;width:12px;height:12px;background:var(--bg);border:2.5px solid var(--ink);border-left:0;border-top:0}
.coach.up::after{top:-9px;right:34px;transform:rotate(-135deg)}
.coach.down::after{bottom:-9px;left:50%;margin-left:-6px;transform:rotate(45deg)}
#cTap{bottom:100%;left:50%;transform:translateX(-50%);margin-bottom:14px;white-space:nowrap;font-weight:700;background:var(--y)}
#cTap::after{background:var(--y)}
#cGoal{top:100%;right:0;margin-top:12px;max-width:86%}
#app.sp-tap #cTap,#app.nudge #cTap{display:block}
#app.sp-num #cGoal{display:block}
#app.nudge #finger{display:block}
#app.nudge #tap{animation:pulse 1s ease-in-out infinite}
.gm{display:inline-block;vertical-align:-4px;margin-right:6px}
.gmap{display:block}
#kju{position:absolute;left:4px;top:4px;width:84px;z-index:2;pointer-events:none}
#kju[hidden]{display:none}
#kju.bounce{animation:bounce .12s}
.wf{transform-origin:104px 104px;animation:wave .45s ease-in-out infinite alternate}
@keyframes wave{from{transform:rotate(-8deg)}to{transform:rotate(12deg)}}
#raidK{display:none}
#app.kju #raid>svg{display:none}
#app.kju #raidK{display:block}
.scene.night{background:#1b2440!important;border-color:var(--r)}
.scene.night .stage{color:#9aa6cf}
.scene.night .outline{stroke:#9aa6cf}
#app.kju #raid{width:120px;top:0}
#tut .btn{margin-top:4px}
#tGoal[hidden]{display:none}
.fws{display:block;width:100%}
.fw{transform-box:fill-box;transform-origin:center;animation:fwk 1.6s ease-out infinite}
.fw.b{animation-delay:.5s}
.fw.c{animation-delay:1s}
@keyframes fwk{0%{transform:scale(.2);opacity:0}25%{opacity:1}100%{transform:scale(1.15);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
#bCta{display:none}
</style>

<main id="app">
  <div id="veil"></div>
  <header class="row">
    <span class="hl">북한이 변했음 좋겠음</span>
    <span class="row" style="gap:6px"><button class="iconbtn" id="bHelp" type="button" aria-label="help">?</button><span class="pill" id="timer">1:00</span></span>
  </header>
  <section class="row nums">
    <div><div class="lab"><i class="dot y"></i><span data-c="hudReached"></span></div><b id="nS">0</b></div>
    <div class="rt" id="numC"><div class="lab"><i class="dot b"></i><span data-c="hudChanged"></span> <span class="small">/ 2,500만</span></div><span class="gm" id="gm"></span><b id="nC" class="blue">0</b></div>
    <div class="coach up" id="cGoal"></div>
  </section>
  <section class="scene" id="scene">
    <svg id="field" viewBox="0 0 300 190" aria-hidden="true"></svg>
    <div class="stage" id="stageLab"></div>
    <div id="raid" aria-hidden="true"><span id="raidK"></span>
      <svg viewBox="0 0 92 150"><path d="M46 44L8 148h84z" fill="rgba(255,226,77,.55)"/><circle cx="30" cy="16" r="10" fill="#fff" stroke="#111" stroke-width="2.5"/><path d="M19 12q11-9 22 0" fill="none" stroke="#111" stroke-width="4" stroke-linecap="round"/><path d="M30 26v20M30 32l14 8" fill="none" stroke="#111" stroke-width="3" stroke-linecap="round"/><rect x="40" y="36" width="12" height="8" rx="2" fill="#111"/></svg>
    </div>
    <div class="banner" id="banner"></div>
    <div id="guy">
      <svg viewBox="0 0 150 96" aria-hidden="true">
        <path d="M58 8h84q6 0 6 6v20q0 6-6 6H84l-10 9 2-9H58q-6 0-6-6V14q0-6 6-6z" fill="#fff" stroke="#111" stroke-width="2.2" stroke-linejoin="round"/>
        <text id="bubT" x="100" y="30" text-anchor="middle" font-size="17">변했음 좋겠음</text>
        <circle cx="30" cy="58" r="19" fill="#fff" stroke="#111" stroke-width="2.5"/>
        <path d="M12 54q4-18 20-17t17 15q-10-8-19-7t-18 9z" fill="#111"/>
        <g class="fn"><path d="M21 61h6M34 61h6" stroke="#111" stroke-width="2.5" stroke-linecap="round"/><path d="M26 69h9" stroke="#111" stroke-width="2.2" stroke-linecap="round"/></g>
        <g class="fw"><circle cx="24" cy="61" r="2.8" fill="#fff" stroke="#111" stroke-width="2"/><circle cx="37" cy="61" r="2.8" fill="#fff" stroke="#111" stroke-width="2"/><path d="M25 70q2-3 4 0t4 0" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round"/><path d="M52 47q4 6 0 9q-4-3 0-9z" fill="#9cc7ff" stroke="#111" stroke-width="1.4"/></g>
        <path d="M22 78q8 6 17 0v16H22z" fill="#ffe24d" stroke="#111" stroke-width="2.5" stroke-linejoin="round"/>
        <rect x="44" y="76" width="12" height="15" rx="2" fill="#2f6bff" stroke="#111" stroke-width="2" transform="rotate(12 50 83)"/>
      </svg>
    </div>
    <div id="fx"></div>
    <div id="tut" hidden>
      <div class="tstep" id="tStep"></div>
      <p class="ttext" id="tA"></p>
      <p class="ttext" id="tB"></p>
      <svg id="tDemo" viewBox="0 0 300 70" aria-hidden="true"></svg>
      <div class="legend" id="tGoal" hidden></div>
      <button class="btn" id="tBtn" type="button"></button>
    </div>
    <div id="kju" hidden></div>
  </section>
  <div class="xp" aria-hidden="true"><div id="xpFill"></div></div>
  <section class="row strip" aria-hidden="true">
    <span class="sti"><svg viewBox="0 0 24 24" fill="#ffe24d" stroke="#111" stroke-width="2" stroke-linejoin="round"><path d="M6 3h9l4 4v14H6z"/></svg>SD 카드 <span class="pips" id="pip_sd"></span></span>
    <span class="sti"><svg viewBox="0 0 24 24" fill="#fff" stroke="#111" stroke-width="2" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9c-4.5-1-8-4-8-9V6z"/></svg>보안 기술 <span class="pips" id="pip_sec"></span></span>
    <span class="sti"><svg viewBox="0 0 24 24" fill="#fff" stroke="#111" stroke-width="2" stroke-linejoin="round"><rect x="3" y="5" width="18" height="13" rx="2"/><path d="M10 9v5l5-2.5z" fill="#2f6bff"/></svg>콘텐츠 <span class="pips" id="pip_con"></span></span>
  </section>
  <div class="tapwrap">
    <div class="coach down" id="cTap"></div>
    <button id="tap" type="button" class="pulse"></button>
    <svg id="finger" viewBox="0 0 48 60" aria-hidden="true"><path d="M18 4c3 0 5 2 5 5v17l12 3c3 1 5 3 5 7v9c0 7-5 11-12 11h-8c-5 0-8-2-10-6L4 38c-2-3 1-6 4-4l5 4V9c0-3 2-5 5-5z" fill="#fff" stroke="#111" stroke-width="2.5" stroke-linejoin="round"/></svg>
  </div>

  <div class="over show" id="oStart">
    <h1><span class="hl">북한이 변했음 좋겠음</span></h1>
    <div class="legend" id="startMaps"></div>
    <div class="copybox"><p class="copy" data-c="goalLine"></p><span class="ph">placeholder copy</span></div>
    <button class="btn" id="bStart" type="button" data-c="btnStart"></button>
    <button class="btn ghost" id="bRank" type="button" data-c="btnRank"></button>
    <button class="btn mini ghost" id="bTut" type="button" style="align-self:center">튜토리얼 다시 보기</button>
  </div>

  <div class="over" id="oPick">
    <h1 data-c="lvTitle"></h1>
    <p class="sub" data-c="lvSub"></p>
    <div class="cards">

<script>
// MODEL-START
var CFG={N:25000000,T:60,S0:5,
  tapBase:2,tapK:0.0238,autoK:0.216,sdBoost:[1,1.4,1.95],
  friction:[1,0.6,0.42,0.3],
  conRate:[0,0.028,0.058],
  raidFirst:8,raidMin:8,raidMax:12,
  catchP:[0.85,0.5,0.15],lossF:[0.6,0.35,0.12],freeze:3,
  maxLv:2,holdRate:0,tapMs:125,
  xp:[150,20000,1500000],
  stages:[1000,100000,3000000,25000000]};
function newState(){return {t:0,R:CFG.S0,C:0,peak:CFG.S0,sd:1,sec:0,con:1,picks:0,pending:0,frozen:0,nextRaid:CFG.raidFirst,raids:0,caught:0,over:false,clear:false}}
function S(st){return st.R+st.C}
function canPick(st){return st.sd<CFG.maxLv||st.sec<CFG.maxLv||st.con<CFG.maxLv}
function bump(st){
  var s=S(st); if(s>st.peak)st.peak=s;
  while(st.picks+st.pending<CFG.xp.length&&st.peak>=CFG.xp[st.picks+st.pending]&&canPick(st))st.pending++;
}
function stageOf(st){var i=0;while(i<3&&st.peak>=CFG.stages[i])i++;return i}
function boost(st){return CFG.sdBoost[st.sd]*CFG.friction[stageOf(st)]}
function tap(st){
  if(st.over||st.frozen>0||st.pending>0)return 0;
  var s=S(st),add=Math.max(CFG.tapBase,s*CFG.tapK*boost(st));
  add=Math.max(0,Math.min(add,CFG.N-s));
  st.R+=add; bump(st); return add;
}
/* While a 단속 lock is on, everything stops: no taps, no spreading on its own, no minds changing. */
function step(st,dt,rnd){
  var ev=[]; if(st.over||st.pending>0)return ev;
  st.t+=dt;
  if(st.frozen>0){st.frozen=Math.max(0,st.frozen-dt)}
  else{
    var s=S(st); st.R+=s*CFG.autoK*boost(st)*(1-s/CFG.N)*dt;
    var conv=Math.min(st.R,S(st)*CFG.conRate[st.con]*dt); st.R-=conv; st.C+=conv;
  }
  if(st.C>=CFG.N-1){st.C=CFG.N;st.R=0;st.over=true;st.clear=true;ev.push({type:'over'});return ev}
  if(st.t>=st.nextRaid&&st.t<CFG.T){
    st.raids++; st.nextRaid=st.t+CFG.raidMin+rnd()*(CFG.raidMax-CFG.raidMin);
    if(rnd()<CFG.catchP[st.sec]){
      var lost=st.R*CFG.lossF[st.sec];
      st.R-=lost; st.caught++; st.frozen=CFG.freeze; ev.push({type:'caught',lost:lost});
    }else ev.push({type:'safe'});
  }
  bump(st);
  if(st.t>=CFG.T){st.t=CFG.T;st.over=true;ev.push({type:'over'})}
  return ev;
}
function pick(st,k){
  if(st.pending<=0||st[k]>=CFG.maxLv)return false;
  st[k]++; st.pending--; st.picks++; return true;
}

/* share: a link plus one line. The phone's own share menu where the page may open it, otherwise copy to the clipboard, otherwise a box to copy from by hand. */
var SHARE_URL='https://iap.libertyinnorthkorea.or.kr/test-r4n8wq/';
var SHARE_TAGS='utm_source=game_share&utm_medium=referral';
function shareLink(){
  if(!SHARE_URL)return '';
  if(SHARE_URL.indexOf('claude.ai')!==-1||!SHARE_TAGS)return SHARE_URL;

  function box(){var b=$('shBox');b.hidden=false;b.value=full;b.focus();b.select();$('shNote').textContent=''}
  function copy(){
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(full).then(function(){$('shNote').textContent=COPY.copied},box);
    }else box();
  }
  var data={title:document.title,text:text};if(url)data.url=url;
  var inViewer=!!(window.claude&&typeof window.claude.use==='function'),can=false;
  try{can=!inViewer&&typeof navigator.share==='function'&&(!navigator.canShare||navigator.canShare(data))}catch(e){can=false}
  if(can){navigator.share(data).then(function(){},function(err){if(err&&err.name==='AbortError')return;copy()})}
  else copy();
}

var LB={db:null,uid:null,mode:'local',rows:[],local:[],posted:false,myId:null,loading:false,timer:0};
function better(a,b){return (b.score-a.score)||((b.left||0)-(a.left||0))}

      [String(i+1),r.ini||'???',fmt(r.score)+(r.left?' +'+clock(r.left):'')].forEach(function(t,k){var s=document.createElement('span');s.textContent=t;if(k===2)s.className='blue';d.appendChild(s)});

function lbInit(){
  lbLoadLocal();lbRender();
  if(!(window.claude&&typeof window.claude.use==='function'))return;
  LB.loading=true;lbRender();
  LB.timer=setTimeout(function(){LB.loading=false;lbRender()},10000);
  function off(){clearTimeout(LB.timer);LB.mode='local';LB.loading=false;lbRender()}
  Promise.all([window.claude.use('db'),window.claude.use('user')]).then(function(r){
    var db=r[0],user=r[1];
    if(!db){off();return}
    LB.db=db;
    Promise.resolve(user&&typeof user.id==='function'?user.id():null).then(function(id){LB.uid=id||null;if(id){LB.myId=id;lbRender()}},function(){});
    try{
      db.collection('scores3').orderBy('score','desc').limit(40).onSnapshot(function(snap){
        clearTimeout(LB.timer);LB.mode='shared';LB.loading=false;
        LB.rows=snap.docs.map(function(d){var x=d.data()||{};return {id:d.id,ini:String(x.ini||'').slice(0,3),score:+x.score||0,left:+x.left||0}});
        lbRender();
      },off);
    }catch(e){off()}
  },off);
}
function lbSubmit(e){
  e.preventDefault();if(LB.posted||!lastScore)return;
  var ini=String($('lbIni').value||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(ini.length<2||ini.length>3){lbNote(COPY.lbBad,true);return}
  var row={ini:ini,score:lastScore.score,left:lastScore.left,reached:lastScore.reached,caught:lastScore.caught,v:'idle-3.0',at:new Date().toISOString()};
  LB.posted=true;$('lbSave').disabled=true;$('lbIni').disabled=true;
  var lid='l'+Date.now();LB.local.push({id:lid,ini:row.ini,score:row.score,left:row.left});lbSaveLocal();
  try{localStorage.setItem('idle-game-ini',ini)}catch(e2){}
  if(!(LB.db&&LB.uid&&LB.mode==='shared')){
    LB.myId=lid;lbNote(LB.db?COPY.lbReadOnly:COPY.lbSavedLocal);lbRender();return;
  }
  var ref=LB.db.doc('scores3/'+LB.uid);
  ref.get().then(function(snap){
    var old=snap.exists?(snap.data()||{}):null;
    if(old&&better({score:+old.score||0,left:+old.left||0},row)<=0){lbNote(COPY.lbBest.replace('{score}',fmt(+old.score||0)));lbRender();return null}
    return ref.set(row).then(function(){lbNote(COPY.lbSavedShared);lbRender()});
  }).then(null,function(err){
    lbNote(err&&err.code==='invalid_argument'?COPY.lbReadOnly:COPY.lbFail,true);lbRender();
  });
}

/* wiring */
var tapBtn=$('tap');
tapBtn.addEventListener('pointerdown',function(e){pressStart(e)});
['pointerup','pointercancel','pointerleave'].forEach(function(n){tapBtn.addEventListener(n,stopHold)});
window.addEventListener('blur',stopHold);
tapBtn.addEventListener('click',function(e){if(e.detail===0)tapOnce(null)});
$('app').addEventListener('pointerdown',function(e){
  var t=e.target;if(!t.closest||t.closest('button')||t.closest('input')||t.closest('.over'))return;
  if(tutStep<0&&(!running||paused))return;
  if(t.closest('#scene'))ripple(e);
  tapOnce(e);
});
$('bStart').addEventListener('click',function(){start(false)});
$('tBtn').addEventListener('click',tutNext);
$('bAgain').addEventListener('click',function(){start(false)});
['bTut','bTut2','bTut3'].forEach(function(id){$(id).addEventListener('click',function(){start(true)})});
$('bHelp').addEventListener('click',function(){
  if(!running||tutStep>=0||$('oPick').classList.contains('show'))return;
  paused=true;stopHold();$('oHelp').classList.add('show');
});
$('bResume').addEventListener('click',function(){$('oHelp').classList.remove('show');paused=false});
$('bRank').addEventListener('click',function(){$('oBoard').classList.add('show');lbRender()});
$('bBack').addEventListener('click',function(){$('oBoard').classList.remove('show')});
$('lbForm').addEventListener('submit',lbSubmit);
$('bShare').addEventListener('click',doShare);
$('bKakao').addEventListener('click',doKakao);
[].forEach.call(document.querySelectorAll('.card'),function(b){
  b.addEventListener('click',function(){
    if(pick(st,b.getAttribute('data-k'))){
      if(st.pending>0)openPick();else $('oPick').classList.remove('show');
      render();
    }
  });
});
function boot(){
  [].forEach.call(document.querySelectorAll('[data-c]'),function(e){var v=COPY[e.getAttribute('data-c')];if(typeof v==='string')e.textContent=v});
  $('tap').textContent=tapLabel();
  if(KJU){$('app').classList.add('kju');$('raidK').innerHTML=kjuScan()}
  demoBuild();$('startMaps').innerHTML=mapSvg('s0',0,72)+'<span>→</span>'+mapSvg('s1',1,72);
  buildField(false);render();lbInit();kakaoInit();requestAnimationFrame(frame);
}
window.IdleGame={CFG:CFG,state:function(){return st},start:start,
  /* test aid: advance the game by so many seconds without waiting for the screen */
  tick:function(sec){afterChange();var n=Math.round(sec/0.1);for(var i=0;i<n&&running&&!paused&&st.pending===0;i++){handle(step(st,0.1,Math.random));afterChange()}render()}};
if(window.claude&&window.claude.hot&&typeof window.claude.hot.ready==='function'){window.claude.hot.ready(boot)}else{boot()}
})();
</script>
